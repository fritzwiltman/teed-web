name: Database tests
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
permissions:
  contents: read
jobs:
  rls:
    name: Migrations, seed and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0   # pinned: resolving 'latest' hits GitHub's API rate limit
      # Local Supabase Postgres: applies supabase/migrations, then supabase/seed/*.sql.
      - name: Start database
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db

  functions:
    name: Edge function tests
    runs-on: ubuntu-latest
    env:
      # A throwaway value for the local stack. Production has its own, set as a function secret.
      SPECTATOR_LINK_SECRET: local-ci-only-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0   # pinned: resolving 'latest' hits GitHub's API rate limit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Local stack: database, Auth, Data API, the edge runtime serving supabase/functions and the
      # mail catcher the sign-in emails land in.
      # Only what the tests use (Realtime included: scores must reach a second phone); one retry
      # because image pulls are sometimes rate limited.
      - name: Start Supabase
        run: |
          start() { supabase start -x studio,storage-api,imgproxy,postgres-meta,logflare,vector,supavisor; }
          start || { supabase stop --no-backup || true; sleep 20; start; }
      # Auth reads the email templates from the gateway once, as it starts, and the gateway is
      # often not up yet: it then sends its stock emails. Starting Auth again picks them up.
      - name: Reload the email templates
        run: |
          docker restart supabase_auth_teed
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:54321/auth/v1/health -H "apikey: $(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" > /dev/null && break
            sleep 1
          done
      - name: Export local URL and keys
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          cut -d= -f1 "$RUNNER_TEMP/supabase.env"
          sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' "$RUNNER_TEMP/supabase.env" >> "$GITHUB_ENV"
      - name: Run edge function tests
        run: node --test supabase/tests/functions/accounts.test.mjs
      # A round end to end with the app's own client library: set up, scored from two phones
      # over Realtime, retried without duplicates, finalized. After the test above, not beside
      # it: both read the one mail catcher.
      - name: Install the client library
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the round tests
        run: node --test supabase/tests/functions/rounds.test.mjs
