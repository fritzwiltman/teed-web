<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Arlo the dog pawing a golf ball into the hole">
<style>
  .paw{transform-box:view-box;transform-origin:152px 126px;animation:tap 3.2s ease-in-out infinite}
  .ball{transform-box:fill-box;transform-origin:50% 50%;animation:roll 3.2s linear infinite}
  .cupflag{transform-box:fill-box;transform-origin:0% 100%;animation:cheer 3.2s ease-in-out infinite}
  .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .3s ease-in-out infinite alternate}
  .flag{transform-box:fill-box;transform-origin:0% 50%;animation:wave 1.1s ease-in-out infinite alternate}
  .head{transform-box:view-box;transform-origin:140px 112px;animation:tilt 2.4s ease-in-out infinite}
  .tongue{transform-box:fill-box;transform-origin:50% 0;animation:pant .4s ease-in-out infinite alternate}
  @keyframes tap{0%,8%,26%,100%{transform:rotate(0deg)}17%{transform:rotate(16deg)}}
  @keyframes roll{0%,20%{transform:translate(0,0) rotate(0deg);opacity:1;animation-timing-function:cubic-bezier(.2,.7,.4,1)}58%{transform:translate(57px,6px) rotate(420deg);opacity:1}64%{transform:translate(60px,9px) rotate(440deg) scale(.45);opacity:1}68%,90%{transform:translate(60px,9px) scale(.45);opacity:0}91%{transform:translate(0,0) scale(1);opacity:0}100%{transform:translate(0,0);opacity:1}}
  @keyframes cheer{0%,62%,80%,100%{transform:rotate(0deg)}68%{transform:rotate(-6deg)}74%{transform:rotate(4deg)}}
  @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  @keyframes wave{from{transform:scaleX(1) skewY(0deg)}to{transform:scaleX(.86) skewY(5deg)}}
  @keyframes tilt{0%,40%,100%{transform:rotate(0deg)}55%,85%{transform:rotate(-7deg)}}
  @keyframes pant{from{transform:scaleY(1)}to{transform:scaleY(1.15)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<!-- green -->
<ellipse cx="170" cy="182" rx="156" ry="16" fill="#3F9152"/>
<ellipse cx="170" cy="180" rx="148" ry="12" fill="#4BA35F"/>
<!-- pin -->
<ellipse cx="256" cy="181" rx="9" ry="3.2" fill="#0E2A18"/>
<g class="cupflag"><rect x="254.5" y="40" width="3" height="141" rx="1.5" fill="#F2F5F3"/>
<path class="flag" d="M257.5 42 L 296 54 L 257.5 66 Z" fill="#E0413A"/>
<circle cx="256" cy="39" r="2.6" fill="#F2F5F3"/></g>
<!-- dog shadow -->
<ellipse cx="142" cy="182" rx="50" ry="5" fill="#000" opacity=".18"/>
<!-- tail -->
<g class="tail"><path d="M170 168 C 192 166, 204 150, 198 134 C 196 130, 190 130, 189 135 C 190 148, 184 156, 168 158 Z" fill="#D29A68"/></g>
<!-- haunches -->
<ellipse cx="116" cy="160" rx="22" ry="19" fill="#D29A68"/>
<ellipse cx="164" cy="160" rx="22" ry="19" fill="#D29A68"/>
<ellipse cx="108" cy="178" rx="13" ry="5.5" fill="#E6B483"/>
<ellipse cx="172" cy="178" rx="13" ry="5.5" fill="#E6B483"/>
<!-- body -->
<path d="M118 122 C 116 104, 164 104, 162 122 L 166 168 C 160 176, 120 176, 114 168 Z" fill="#E6B483"/>
<!-- standing front leg -->
<rect x="122" y="130" width="15" height="48" rx="7.5" fill="#E6B483"/>
<ellipse cx="129.5" cy="178" rx="10" ry="5" fill="#EDC296"/>
<!-- pawing leg -->
<g class="paw">
  <g transform="translate(152 126) rotate(-42)"><rect x="-7.5" y="0" width="15" height="52" rx="7.5" fill="#E6B483"/><ellipse cx="0" cy="52" rx="9" ry="6" fill="#EDC296"/></g>
</g>
<!-- ball -->
<g class="ball"><circle cx="196" cy="174" r="7" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1"/><circle cx="193.5" cy="172" r="1" fill="#C9D2CB"/><circle cx="197.5" cy="171" r="1" fill="#C9D2CB"/><circle cx="198.5" cy="175" r="1" fill="#C9D2CB"/><circle cx="194.5" cy="176" r="1" fill="#C9D2CB"/></g>
<!-- bandana -->
<path d="M116 112 C 128 118, 152 118, 164 112 L 142 140 C 141 141, 139 141, 138 140 Z" fill="#F4F1EA"/>
<circle cx="128" cy="119" r="2.4" fill="#D9473F"/><circle cx="140" cy="122" r="2.4" fill="#3F9152"/><circle cx="152" cy="119" r="2.4" fill="#D9473F"/><circle cx="134" cy="128" r="2.2" fill="#3F9152"/><circle cx="146" cy="129" r="2.2" fill="#D9473F"/><circle cx="140" cy="135" r="1.8" fill="#3F9152"/>
<!-- head -->
<g class="head">
  <ellipse cx="111" cy="94" rx="10" ry="23" fill="#D29A68" transform="rotate(10 111 94)"/>
  <ellipse cx="169" cy="94" rx="10" ry="23" fill="#D29A68" transform="rotate(-10 169 94)"/>
  <ellipse cx="140" cy="84" rx="27" ry="26" fill="#E6B483"/>
  <circle cx="128" cy="61" r="7" fill="#E6B483"/><circle cx="140" cy="58" r="8" fill="#EDC296"/><circle cx="152" cy="61" r="7" fill="#E6B483"/>
  <circle cx="109" cy="104" r="5" fill="#D29A68"/><circle cx="171" cy="104" r="5" fill="#D29A68"/>
  <ellipse cx="140" cy="97" rx="15" ry="11" fill="#EDC296"/>
  <path class="tongue" d="M134 103 C 134 113, 146 113, 146 103 Z" fill="#E86B7A"/>
  <path d="M132 101 Q 140 106 148 101" stroke="#4A3328" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="140" cy="91" rx="5.5" ry="4" fill="#3B2A22"/>
  <circle cx="129" cy="80" r="3.4" fill="#2A1E18"/><circle cx="151" cy="80" r="3.4" fill="#2A1E18"/>
  <circle cx="130" cy="79" r="1" fill="#FFF"/><circle cx="152" cy="79" r="1" fill="#FFF"/>
</g>
</svg>
